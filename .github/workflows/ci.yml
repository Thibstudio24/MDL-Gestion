name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualite:
    name: Qualité du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Bandit (sécurité, sévérité moyenne et plus)
        run: bandit -q -c pyproject.toml -r . -ll

  tests:
    name: Tests (Django ${{ matrix.django }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django: ["5.2"]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Fichier d'instance de test
        run: cp config/instance.example.json config/instance.json

      - name: Vérifications Django
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Migrations
        run: python manage.py migrate --noinput

      - name: Tests
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Téléversement de la couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
