{% extends "accounts/_bare.html" %}
{% block auth_content %}
<h3>Mot de passe oublié</h3>
<p class="small muted">Saisissez l'adresse du compte : un lien valable 3 heures vous sera envoyé.</p>
<form method="post">{% csrf_token %}{% include "partials/_form.html" %}
<button type="submit" class="btn btn-primary" style="width:100%">Envoyer le lien</button></form>
<div class="auth-links"><a href="/connexion/">Retour à la connexion</a></div>
{% endblock %}
