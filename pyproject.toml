[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["hub", "migrations", "static"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008", "B904"]

[tool.bandit]
exclude_dirs = ["tests", "hub", ".venv", "migrations", "static"]
skips = ["B101", "B311", "B404", "B603", "B607"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
